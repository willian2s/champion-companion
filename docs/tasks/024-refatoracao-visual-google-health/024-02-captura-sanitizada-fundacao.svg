<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980" role="img" aria-labelledby="title desc">
  <title id="title">Fundação visual opt-in 024-02</title>
  <desc id="desc">Reconstrução vetorial sanitizada de página, cabeçalho, seção, métrica e grupo de ações.</desc>
  <rect width="800" height="980" fill="#F8FAFC"/>
  <rect x="40" y="40" width="720" height="900" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="80" y="105" fill="#0F172A" font-family="sans-serif" font-size="32" font-weight="700">Resumo de saúde</text>
  <text x="80" y="140" fill="#475569" font-family="sans-serif" font-size="20">Informações locais organizadas por prioridade.</text>
  <line x1="80" y1="180" x2="720" y2="180" stroke="#E2E8F0" stroke-width="2"/>
  <text x="80" y="235" fill="#0F172A" font-family="sans-serif" font-size="25" font-weight="700">Métricas principais</text>
  <text x="80" y="268" fill="#64748B" font-family="sans-serif" font-size="18">Valores demonstrativos, sem dados pessoais.</text>
  <rect x="80" y="305" width="640" height="190" rx="24" fill="#E0F2FE"/>
  <text x="112" y="355" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="700">Métrica</text>
  <text x="112" y="415" fill="#0F172A" font-family="sans-serif" font-size="42" font-weight="700">Sem dados</text>
  <text x="112" y="455" fill="#475569" font-family="sans-serif" font-size="18">Origem local · Período atual</text>
  <text x="80" y="565" fill="#0F172A" font-family="sans-serif" font-size="25" font-weight="700">Ações</text>
  <rect x="80" y="605" width="640" height="64" rx="32" fill="#075985"/>
  <text x="400" y="646" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="21" font-weight="700">Atualizar resumo</text>
  <rect x="80" y="695" width="640" height="64" rx="32" fill="#FFFFFF" stroke="#075985" stroke-width="3"/>
  <text x="400" y="736" text-anchor="middle" fill="#075985" font-family="sans-serif" font-size="21" font-weight="700">Ver detalhes</text>
  <text x="80" y="855" fill="#64748B" font-family="sans-serif" font-size="16">Reconstrução estrutural sanitizada · sem screenshot bruto</text>
</svg>
