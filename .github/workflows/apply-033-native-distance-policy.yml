name: Apply 033 native distance policy

on:
  push:
    branches: [feat/033-unified-watch-daily-sync]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/033-unified-watch-daily-sync
          fetch-depth: 0

      - name: Apply native distance policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, anchor, old, new, span=20000):
              p = Path(path)
              s = p.read_text()
              i = s.find(anchor)
              if i < 0:
                  raise SystemExit(f'{path}: anchor not found: {anchor}')
              j = min(len(s), i + span)
              part = s[i:j]
              n = part.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: {anchor}: expected 1 target, got {n}')
              p.write_text(s[:i] + part.replace(old, new, 1) + s[j:])

          patch(
              'app/src/main/java/br/com/mwconsulting/championcompanion/core/model/WatchWorkoutDerivedMetrics.kt',
              'object WatchWorkoutNativeDistancePolicy',
              'WorkoutType.UNKNOWN,\n                WorkoutType.RUNNING,\n                WorkoutType.WALKING,',
              'WorkoutType.UNKNOWN,\n                WorkoutType.RUNNING,\n                WorkoutType.WALKING,\n                WorkoutType.FREE_WORKOUT,\n                WorkoutType.TREADMILL,',
              5000,
          )

          room = 'app/src/main/java/br/com/mwconsulting/championcompanion/data/RoomRepositories.kt'
          patch(
              room,
              'override suspend fun submitReview',
              'reviewed.confirmedType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING)',
              'reviewed.confirmedType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.FREE_WORKOUT, WorkoutType.TREADMILL)',
          )
          patch(
              room,
              'override fun observeLearnedDistanceCalibrationProfiles',
              '''combine(\n                    database.distanceCalibrationEvidenceDao()\n                        .observeActiveByProfileAndWorkoutType(profile.id, WorkoutType.RUNNING.name)\n                        .map { it.toLearnedDistanceCalibrationProfile(WorkoutType.RUNNING) },\n                    database.distanceCalibrationEvidenceDao()\n                        .observeActiveByProfileAndWorkoutType(profile.id, WorkoutType.WALKING.name)\n                        .map { it.toLearnedDistanceCalibrationProfile(WorkoutType.WALKING) },\n                ) { running, walking -> listOfNotNull(running, walking) }''',
              '''combine(\n                    database.distanceCalibrationEvidenceDao()\n                        .observeActiveByProfileAndWorkoutType(profile.id, WorkoutType.RUNNING.name)\n                        .map { it.toLearnedDistanceCalibrationProfile(WorkoutType.RUNNING) },\n                    database.distanceCalibrationEvidenceDao()\n                        .observeActiveByProfileAndWorkoutType(profile.id, WorkoutType.WALKING.name)\n                        .map { it.toLearnedDistanceCalibrationProfile(WorkoutType.WALKING) },\n                    database.distanceCalibrationEvidenceDao()\n                        .observeActiveByProfileAndWorkoutType(profile.id, WorkoutType.TREADMILL.name)\n                        .map { it.toLearnedDistanceCalibrationProfile(WorkoutType.TREADMILL) },\n                ) { running, walking, treadmill -> listOfNotNull(running, walking, treadmill) }''',
              7000,
          )
          patch(
              room,
              'override suspend fun applyReferenceDistanceCalibration',
              'type !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING)',
              'type !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.TREADMILL)',
          )
          patch(
              room,
              'private suspend fun resolveLearnedDistanceCalibrationFactorInternal',
              'workoutType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING)',
              'workoutType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.TREADMILL)',
              4000,
          )
          # Allow edit/remove of native treadmill evidence when this helper has the same type gate.
          p = Path(room)
          s = p.read_text()
          i = s.find('private fun canMutateReferenceDistanceCalibration')
          if i >= 0:
              j = min(len(s), i + 6000)
              part = s[i:j]
              old = 'setOf(WorkoutType.RUNNING, WorkoutType.WALKING)'
              if old in part:
                  p.write_text(s[:i] + part.replace(old, 'setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.TREADMILL)', 1) + s[j:])

          patch(
              'app/src/main/java/br/com/mwconsulting/championcompanion/data/DatabaseMappers.kt',
              'internal fun List<DistanceCalibrationEvidenceEntity>.toLearnedDistanceCalibrationProfile',
              'if (workoutType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING)) return null',
              'if (workoutType !in setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.TREADMILL)) return null',
              5000,
          )

          patch(
              'app/src/main/java/br/com/mwconsulting/championcompanion/feature/exercises/ExercisesViewModel.kt',
              'private fun submitCalibration',
              'activity.confirmedType in setOf(WorkoutType.RUNNING, WorkoutType.WALKING)',
              'activity.confirmedType in setOf(WorkoutType.RUNNING, WorkoutType.WALKING, WorkoutType.TREADMILL)',
              8000,
          )

          patch(
              'app/src/main/java/br/com/mwconsulting/championcompanion/core/model/WatchWorkoutActivity.kt',
              'val requiresWatchWorkoutReprocessing',
              '''confirmedType !in setOf(\n                    WorkoutType.UNKNOWN,\n                    WorkoutType.RUNNING,\n                    WorkoutType.WALKING,\n                    WorkoutType.CYCLING,\n                )''',
              '''confirmedType !in setOf(\n                    WorkoutType.UNKNOWN,\n                    WorkoutType.RUNNING,\n                    WorkoutType.WALKING,\n                    WorkoutType.FREE_WORKOUT,\n                    WorkoutType.TREADMILL,\n                    WorkoutType.CYCLING,\n                )''',
              7000,
          )

          spec = Path('docs/specs/032-d4-native-workout-metrics.md')
          s = spec.read_text()
          if '## Evolução de política pós-032 — 2026-09-14' not in s:
              spec.write_text(s.rstrip() + '''\n\n## Evolução de política pós-032 — 2026-09-14\n\nA validação física da entrega 033 mostrou um `FREE_WORKOUT` D4 v4 íntegro com distância nativa positiva. Para novas operações, a restrição original de R6/R8 é supersedida: `FREE_WORKOUT` preserva `WATCH_NATIVE`; `TREADMILL` também usa a distância D4 nativa e continua exigindo a distância final da esteira para calibração. A calibração de esteira usa `referência / distância D4`, escala proporcionalmente cada intervalo nativo e aprende um fator contextual próprio de `TREADMILL`, sem compartilhar evidência com `RUNNING` ou `WALKING`. `CYCLING` permanece inalterado. Atividades já sincronizadas e fatos raw não são reescritos.\n''')

          overview = Path('docs/tasks/033-unified-watch-daily-sync/033-00-overview.md')
          s = overview.read_text()
          if '### Evolução física: distância D4 em treino livre e esteira — 2026-09-14' not in s:
              overview.write_text(s.rstrip() + '''\n\n### Evolução física: distância D4 em treino livre e esteira — 2026-09-14\n\nA validação física de 033-10 encontrou `FREE_WORKOUT` `d4-v4` válido com 173 passos, 140 m de distância nativa e 9,169 kcal. A revisão falhava porque removia `WATCH_NATIVE` ao confirmar o tipo. A política foi evoluída: `FREE_WORKOUT` e `TREADMILL` aceitam distância D4 nativa; `TREADMILL` usa a distância final informada pelo usuário para fator contextual próprio. O overlap continua por métrica: D4 `DISTANCE > 0` suprime somente `D1 DISTANCE` sobreposta.\n''')
          PY

      - name: Validate diff
        run: git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Android build
        run: ./gradlew lint assembleDebug assembleRelease

      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-033-native-distance-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(workouts): extend native distance policy'
          git push origin HEAD:feat/033-unified-watch-daily-sync
