name: Android CI

on:
  push:
    branches:
      - main
      - spec/027-workout-steps-cadence-1hz-timeline
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: Lint and assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Record run id
        if: github.event_name == 'push' && github.ref_name == 'spec/027-workout-steps-cadence-1hz-timeline'
        run: |
          mkdir -p .github
          printf '%s\n' '${{ github.run_id }}' > .github/last-027-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-027-run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci(027): registrar run de validação'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Run lint and assemble
        run: ./gradlew lint assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: champion-companion-027-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
